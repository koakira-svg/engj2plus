<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語工場 | 外部データ版</title>
<!-- Firebase SDKなどは必要に応じてここに追加 -->
<style>
  /* 前回のCSSをすべてここに記述してください */
</style>
</head>
<body>
<div class="stage">
  <!-- 画面構成などは前回のものを流用 -->
  <section class="screen active" id="screen-title">
    <h1 class="title-main">英単語工場</h1>
    <button class="start-btn normal" onclick="startGame('normal')">ゲーム開始</button>
    <button class="btn-dict" onclick="openDictionary()">📖 単語帳を見る</button>
  </section>
  <!-- 他の screen-challenge, screen-result 等のHTMLも前回同様に配置 -->
</div>

<script>
// --- 新：外部ファイルから単語を読み込む仕組み ---
let WORD_BANK = [];

async function initGameData() {
  try {
    const response = await fetch('words.json'); // 同じフォルダ内のwords.jsonを読み込む
    const data = await response.json();
    
    // データに難易度とIDを付与
    WORD_BANK = data.map((w, i) => ({
      id: i,
      en: w.en,
      ja: w.ja,
      level: (w.en.length <= 5) ? 1 : 3 // 簡易的なレベル判定
    }));
    console.log("単語データを読み込みました:", WORD_BANK.length + "語");
  } catch (e) {
    alert("words.jsonが見つかりません。同じフォルダに保存してください。");
  }
}

// ページ開始時に読み込み
initGameData();

// --- 以前のロジック ---
// startGame, answer, buildChoices などの関数をここに追加
// ※これ以降は前回のコードの「let WORD_BANK = ...」以降をそのまま貼り付ければ動作します。

</script>
</body>
</html>
