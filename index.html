<script>
// --- 既存の initGameData などはそのまま ---

// --- 追加：単語帳を開く機能 ---
function openDictionary() {
  if (WORD_BANK.length === 0) {
    alert("単語データがまだ読み込まれていません。");
    return;
  }

  // 画面を切り替える
  document.getElementById('screen-title').classList.remove('active');
  
  // 単語帳エリアを作成（もしなければ作る）
  let dictSection = document.getElementById('screen-dict');
  if (!dictSection) {
    dictSection = document.createElement('section');
    dictSection.id = 'screen-dict';
    dictSection.className = 'screen';
    document.querySelector('.stage').appendChild(dictSection);
  }
  dictSection.classList.add('active');

  // 中身を生成
  dictSection.innerHTML = `
    <h2>📖 単語帳 (全 ${WORD_BANK.length} 語)</h2>
    <div id="dictGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;"></div>
    <button onclick="backToTitle()">タイトルに戻る</button>
  `;

  const gridEl = document.getElementById('dictGrid');
  gridEl.innerHTML = WORD_BANK.map((w, index) => `
    <div style="border: 1px solid #ccc; padding: 10px; text-align: center; cursor: pointer;" 
         onclick="this.textContent = (this.textContent === '${w.en}') ? '${w.ja}' : '${w.en}'">
      ${w.en}
    </div>
  `).join('');
}

function backToTitle() {
  document.getElementById('screen-dict').classList.remove('active');
  document.getElementById('screen-title').classList.add('active');
}
</script>
